# Forklift PPO Training Configuration

env:
  agent_names: ["robot1"] # Names of robots in Gazebo
  num_observations: 24  # 20 lidar beams + dist + theta + last_cmd(2)
  lidar_beams: 20       # Match DRL-robot-navigation velodyne_env dimensionality
  num_actions: 2 # [linear_velocity, angular_velocity]
  control_dt: 0.1       # Physics duration per step (seconds) - 10Hz for better RL learning
  max_episode_length: 500  # 仅为 runner 兼容占位，不用于截断回合
  random_spawn:
    x_range: [-4.5, 1]
    y_range: [-5, 5]
  goal_max_attempts: 60
  goal_validation:
    costmap_topic: /robot1/move_base/global_costmap/costmap
    costmap_free_threshold: 50   # >=阈值视为占用
    costmap_inflation: 0.3       # 膨胀半径（米）



  opponent: # 对抗车配置（robot2）
    enabled: false  #若设为 false，环境不重置对抗车位置，不发布 goal。
    model_name: robot2
    goal_topic: /robot2/move_base_simple/goal
    frame_id: map  # goal is published in map frame; init pose来自user_config.yaml
    goal_offset: 0.5  # 对抗目标goal偏移（米），避免与robot1质心完全重合costmap导致规划失败
  
  # Action Scaling & Clipping
  action_scale: [1, 1]
  action_clip_low: [0, -1]  # [v_min, w_min] - 允许负角速度（右转）
  action_clip_high: [0.5, 1]  # [v_max, w_max]
  
  reward_debug: true # 打印 reward 分解用于调试

  reward:
    collision_penalty: -100.0
    goal_reward: 100.0
  reward_shaping:
    distance_scale: 20



  path:
    enabled: false               # 启用全局路径规划
    visualize: false               # 在Rviz中可视化全局路径

  termination:                  # 终止条件
    min_height: -1.0       
    min_collision_range: 0.4  # 碰撞判定阈值（单位：米）
    success_pos: 0.2          # 位置误差容差（米）小于此视为到达目标点

runner:
  algorithm:
    class_name: PPO
    # Training
    learning_rate: 0.001
    num_learning_epochs: 5
    num_mini_batches: 4  # mini batch size = num_envs * num_steps / num_mini_batches
    schedule: adaptive  # adaptive, fixed
    # Value function
    value_loss_coef: 1.0
    clip_param: 0.2
    use_clipped_value_loss: true
    # Surrogate loss
    desired_kl: 0.01
    entropy_coef: 0.01
    gamma: 0.99
    lam: 0.95
    max_grad_norm: 1.0
    # Miscellaneous
    normalize_advantage_per_mini_batch: false
    # Random network distillation
    rnd_cfg:
        weight: 0.0  # Initial weight of the RND reward
        weight_schedule: null # This is a dictionary with a required key called "mode". Please check the RND module for more information
        reward_normalization: false  # Whether to normalize RND reward
        # Learning parameters
        learning_rate: 0.001  # Learning rate for RND
        # Network parameters
        num_outputs: 1  # Number of outputs of RND network. Note: if -1, then the network will use dimensions of the observation
        predictor_hidden_dims: [-1] # Hidden dimensions of predictor network
        target_hidden_dims: [-1]  # Hidden dimensions of target network

  policy:
    class_name: "ResActorCritic" # navbot_ppo 风格残差 Actor-Critic
    init_noise_std: 0.2 # 增加初始探索噪声 (0.1 -> 0.6)
    # actor_hidden_dims: [256, 128, 64]
    # critic_hidden_dims: [256, 128, 64]
    # activation: "elu" 
    actor_obs_normalization: false
    critic_obs_normalization: false
    # rnn_type: 'lstm'
    # rnn_hidden_dims: [128, 128]
    # rnn_num_layers: 1

  obs_groups:
    actor: ["policy"]
    critic: ["privileged"]

  # Rollout horizon per iteration (total_steps = num_envs * num_steps_per_env)
  num_steps_per_env: 500
  max_iterations: 500
  save_interval: 20
  seed: 1
  experiment_name: "forklift_ppo"
  run_name: "run_12"
  
  #loading pre-trained model
  # resume_path: null  # or "path/to/your/model.pth" to resume training
  resume_path: null #/data/lzq/ros_motion_planning/src/rl_training/logs/forklift_ppo/run_7/model_599.pt
  