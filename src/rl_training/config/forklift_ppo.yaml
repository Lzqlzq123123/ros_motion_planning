# Forklift PPO Training Configuration

env:
  agent_names: ["robot1"] # Names of robots in Gazebo
  num_observations: 368
  num_actions: 2 # [linear_velocity, angular_velocity]
  max_episode_length: 256  # Max steps per episode
  control_dt: 0.05        # Physics duration per step (seconds)
  goals:
    - [0, -3.0, -1.57]
    # - [-3, -2, -1.57]
    - [0, 2, 1.57]


  opponent: # 对抗车配置（robot2）
    enabled: false  #若设为 false，环境不重置对抗车位置，不发布 goal。
    model_name: robot2
    goal_topic: /robot2/move_base_simple/goal
    frame_id: map  # goal is published in map frame; init pose来自user_config.yaml
    goal_offset: 0.3  # 对抗目标goal偏移（米），避免与robot1质心完全重合costmap导致规划失败
  
  # Action Scaling & Clipping
  action_scale: [1, 1]
  action_clip_low: [0, -0.6]  # [v_min, w_min] - 允许负角速度（右转）
  action_clip_high: [0.5, 0.6]  # [v_max, w_max]
  
  reward_debug: true # 打印 reward 分解用于调试

  reward:
    type: displacement
    smoothness_scale: -0.05   # 惩罚动作不平滑（负值）
    action_penalty_scale: 0.0 # 惩罚大幅度动作（防止饱和）
    heading_penalty_scale: -1  # 朝向偏差惩罚（负值）
    collision_penalty: -50.0     # 碰撞惩罚（降低惩罚防止 freezing）
    min_range_penalty: -4.0      # 靠障碍太近惩罚（负值）
    min_range_threshold: 0.7       # lidar 小于该距离开始惩罚 （单位：米）  lidar最小0.17米
    goal_reward: 200.0            # 到终点一次性奖励（正值）
    step_cost: -0.1          # 每步负奖励（负值），以鼓励尽快完成任务
    dist_penalty_scale: 0    # 绝对距离惩罚系数（负值）
    progress_reward_scale: 0   # 进度奖励系数（正值，奖励每步靠近目标的距离）

  path:
    enabled: true
    cross_track_penalty_scale: -0.5 # 路径跟随惩罚（横向误差），离路径越远惩罚越大
    path_progress_reward_scale: 100.0 # 沿路径前进奖励（纵向进度）
    visualize: true               # 在Rviz中可视化全局路径

  termination:                  # 终止条件
    min_height: -1.0
    collision: true         
    min_collision_range: 0.2  # 碰撞判定阈值（单位：米）

    # 严格位姿成功条件（终止用）
    success_pos: 0.2            # 位置误差容差（米）小于此视为到达目标点


runner:
  algorithm:
    class_name: "PPO"
    value_loss_coef: 1.0
    use_clipped_value_loss: True
    clip_param: 0.2
    entropy_coef: 0.01  # 稍微增加一点熵，鼓励早期探索
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 3.0e-4
    gamma: 0.99
    max_grad_norm: 1.0
    rnd_cfg: null
    symmetry_cfg: null

  policy:
    class_name: "ActorCritic" # or "RecurrentActorCritic" 
    init_noise_std: 0.6 # 增加初始探索噪声 (0.1 -> 0.6)
    actor_hidden_dims: [256, 128, 64]
    critic_hidden_dims: [256, 128, 64]
    activation: "elu" 
    actor_obs_normalization: true
    critic_obs_normalization: true
    # rnn_type: 'lstm'
    # rnn_hidden_dims: [128, 128]
    # rnn_num_layers: 1

  obs_groups:
    actor: ["policy"]
    critic: ["privileged"]

  # Rollout horizon per iteration (steps = num_envs * num_steps_per_env)
  num_steps_per_env: 1024 # 修复：增加采样长度，稳定梯度
  max_iterations: 600
  save_interval: 10
  experiment_name: "forklift_ppo"
  run_name: "run_10"

  #loading pre-trained model
  # resume_path: null  # or "path/to/your/model.pth" to resume training
  resume_path: null #/data/lzq/ros_motion_planning/src/rl_training/logs/forklift_ppo/run_7/model_599.pt
  