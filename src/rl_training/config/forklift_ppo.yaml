# Forklift PPO Training Configuration

env:
  agent_names: ["robot1"] # Names of robots in Gazebo
  num_observations: 368
  num_actions: 2 # [linear_velocity, angular_velocity]
  max_episode_length: 256  # Max steps per episode
  control_dt: 0.1          # Physics duration per step (seconds)
  goals:
    - [0, -3.0, 0]
    - [0, -2.0, 0]

  opponent: # 对抗车配置（robot2）
    enabled: true  #若设为 false，环境不重置对抗车位置，不发布 goal。
    model_name: robot2
    goal_topic: /robot2/move_base_simple/goal
    frame_id: map  # goal is published in map frame; init pose来自user_config.yaml
    goal_offset: 0.3  # 对抗目标goal偏移（米），避免与robot1质心完全重合costmap导致规划失败
  
  # Action Scaling & Clipping
  action_scale: [1, 1]       # Scale PPO output [-1, 1] to physical units
  action_clip_low: [-0.5, -0.5]  # [v_min, w_min]
  action_clip_high: [0.5, 0.5]  # [v_max, w_max]
  
  reward_debug: true # 打印 reward 分解用于调试

  reward:
    type: displacement
    smoothness_scale: -0.1      # 惩罚动作不平滑（负值）
    action_penalty_scale: -0.01 # 惩罚大幅度动作（防止饱和）
    heading_penalty_scale: -0.1  # 朝向偏差惩罚（负值）
    collision_penalty: -10.0     # 碰撞惩罚（负值）
    min_range_penalty: -2.0      # 靠障碍太近惩罚（负值）
    min_range_threshold: 0.5       # lidar 小于该距离开始惩罚
    goal_reward: 20.0            # 到终点一次性奖励（正值）
    step_cost: -0.001             # 每步负奖励（负值）
    dist_penalty_scale: -0.05    # 绝对距离惩罚系数（负值，reward += dist_to_goal * scale）

    # 靠近终点时
    pose_gate_radius: 0.5       # 进入该距离后开始关注目标姿态
    yaw_reward_scale: -0.1       # 姿态奖励强度（调参用）

  termination:                  # 终止条件
    min_height: -1.0
    collision: true         
    min_collision_range: 0.18  # 碰撞判定阈值（单位：米）

    # 严格位姿成功条件（终止用）
    success_pos: 0.05            # 位置误差容差（米）小于此视为到达目标点
    success_yaw: 0.087266        # 朝向误差容差（弧度）≈5°
    success_lin_vel_th: 0.02     # 线速度阈值（m/s）
    success_ang_vel_th: 0.05     # 角速度阈值（rad/s）
    success_stay_steps: 3        # 满足上述条件连续步数才算成功

runner:
  obs_groups:
    actor: ["policy"]
    critic: ["privileged"]
  algorithm:
    class_name: "PPO"
    value_loss_coef: 1.0
    use_clipped_value_loss: True
    clip_param: 0.2
    entropy_coef: 0.01
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 3.0e-4
    schedule: "adaptive"
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0

  policy:
    class_name: "ActorCritic"
    init_noise_std: 0.5
    actor_hidden_dims: [128, 128]
    critic_hidden_dims: [128, 128]
    activation: "elu"
    actor_obs_normalization: true
    critic_obs_normalization: true

  # Rollout horizon per iteration (steps = num_envs * num_steps_per_env)
  num_steps_per_env: 1024
  max_iterations: 1500
  save_interval: 50
  experiment_name: "forklift_ppo"
  run_name: "run_3"
