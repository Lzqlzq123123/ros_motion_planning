# Forklift PPO Training Configuration

env:
  agent_names: ["robot1"] # Names of robots in Gazebo
  num_observations: 364
  num_actions: 2 # [linear_velocity, angular_velocity]
  max_episode_length: 2000 
  goals:
    - [0, -3.0]
    - [0, -2.0]
  
  # Action Clipping
  action_clip_low: [0.0, -0.5]  # [v_min, w_min]
  action_clip_high: [1.0, 0.5]  # [v_max, w_max]
  
  reward_debug: true # 打印 reward 分解用于调试

  reward:
    type: displacement
    distance_scale: 1.0          # 鼓励移动（正值）
    smoothness_scale: -0.1      # 惩罚动作不平滑（负值）
    heading_penalty_scale: -0.1  # 朝向偏差惩罚（负值）
    collision_penalty: -10.0     # 碰撞惩罚（负值）
    min_range_penalty: -2.0      # 靠障碍太近惩罚（负值）
    min_range_threshold: 1       # lidar 小于该距离开始惩罚
    goal_reward: 20.0            # 到终点一次性奖励（正值）
    dist_reward_scale: 1.0       # 距离缩短奖励系数（正值）
    step_cost: -0.01             # 每步负奖励（负值）

    # 靠近终点时
    pose_gate_radius: 1.5        # 进入该距离后开始关注目标姿态
    yaw_reward_scale: -0.1       # 姿态奖励强度（调参用）

  termination:                  # 终止条件
    min_height: -1.0
    collision: true         
    min_collision_range: 0.55  # 碰撞判定阈值（单位：米）

    # 严格位姿成功条件（终止用）
    success_pos: 0.05            # 位置误差容差（米）小于此视为到达目标点
    success_yaw: 0.087266        # 朝向误差容差（弧度）≈5°
    success_lin_vel_th: 0.02     # 线速度阈值（m/s）
    success_ang_vel_th: 0.05     # 角速度阈值（rad/s）
    success_stay_steps: 3        # 满足上述条件连续步数才算成功

runner:
  obs_groups:
    actor: ["policy"]
    critic: ["privileged"]
  algorithm:
    class_name: "PPO"
    value_loss_coef: 1.0
    use_clipped_value_loss: True
    clip_param: 0.2
    entropy_coef: 0.01
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 1.0e-3
    schedule: "adaptive"
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0

  policy:
    class_name: "ActorCritic"
    init_noise_std: 1.0
    actor_hidden_dims: [512, 256, 128]
    critic_hidden_dims: [512, 256, 128]
    activation: "elu"

  num_steps_per_env: 24
  max_iterations: 1500
  save_interval: 50
  experiment_name: "forklift_ppo"
  run_name: "run_1"
