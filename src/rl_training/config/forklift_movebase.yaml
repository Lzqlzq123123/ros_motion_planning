# MoveBase-backed PPO configuration

env:
  env_class: MoveBaseGazeboEnv
  debug: true                 # set true to log reward/collision details
  agent_names: ["robot1"]
  num_observations: 24
  lidar_beams: 20
  num_actions: 2           # cmd_vel [linear_x, angular_z]
  control_dt: 0.1
  max_episode_length: 500
  scan_dim: 180        # Match lidar_beams for simplicity
  random_spawn:
    ego_spawn_radius: [1.0, 3.0]  # [min, max] 距离 goal 的随机生成半径
  goal_reached_dist: 0.3
  collision_dist: 0.35
  curriculum:
    initial_span: 1.0   # 初始目标采样半径 (m)，从 [-4, 4] 开始
    max_span: 5.0       # 最大扩展到 [-10, 10]
    delta: 0.004         # 每次 reset 扩大步长，约 1500 次 reset 后达到最大
  # Raw map OccupancyGrid for spawn/goal validity checks
  map_topic: "/map"
  map_obstacle_threshold: 50   # cells >= threshold are obstacles; -1 unknown treated as obstacle
  # Costmap subscription for spawn/goal validity checks (optional)
  costmap_topic: "/robot1/move_base/global_costmap/costmap"
  opponent:
    enabled: false
    model_name: "robot2"
    mode: "rule_based"           # "movebase" (PID planner) or "rule_based" (scripted adversarial)
    goal_topic: "/robot2/move_base_simple/goal"
    frame_id: "map"
    goal_offset: 0.5
    spawn_radius: [1.0, 2.0]   # Adv [min, max] 距离 ego goal 的随机生成半径
    rule_based:                 # Parameters for rule_based mode
      linear_speed: 0.5        # 对抗车线速度 (m/s)
      angular_gain: 2.0        # 角度跟踪增益
      follow_dist: 1.0         # follow_stop 模式中触发急停的跟随距离 (m)
      stop_prob: 0.1           # follow_stop 模式中每个 tick 的急停概率
  reward:
    collision_penalty: -100.0
    goal_reward: 100.0
  termination:
    min_collision_range: 0.35
    success_pos: 0.3

runner:
  algorithm:
    class_name: TD3
    learning_rate: 0.001
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: adaptive
    value_loss_coef: 1.0
    clip_param: 0.2
    use_clipped_value_loss: true
    desired_kl: 0.01
    entropy_coef: 0.01
    gamma: 0.99
    lam: 0.95
    max_grad_norm: 1.0
    normalize_advantage_per_mini_batch: false
  policy:
    class_name: "ResActorCritic"
    init_noise_std: 0.2
    actor_obs_normalization: false
    critic_obs_normalization: false
  obs_groups:
    actor: ["policy"]
    critic: ["privileged"]
  num_steps_per_env: 500
  max_iterations: 500
  save_interval: 10
  seed: 1
  experiment_name: "forklift_movebase"
  run_name: "run_12"
  resume_path: null #"/data/lzq/ros_motion_planning/src/rl_training/logs/forklift_movebase/run_3/td3_model"

