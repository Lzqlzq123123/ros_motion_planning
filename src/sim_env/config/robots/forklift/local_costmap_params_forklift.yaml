# Copied from turtlebot3_waffle local costmap params to reuse navigation tuning
# You can later adjust size/resolution for forklift if needed.

global_frame: odom
robot_base_frame: base_footprint

update_frequency: 1.0
publish_frequency: 0.5
transform_tolerance: 1.0

static_map: false
rolling_window: true
width: 3
height: 3
resolution: 0.05

inflation_radius: 0.2