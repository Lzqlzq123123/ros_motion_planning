DWAController:

# Robot Configuration Parameters 
  max_vel_x: 1.5 #X轴线速度的最大/最小值
  min_vel_x: 0 # 负数允许倒车，有助于在狭窄空间或大角度转弯时调整姿态

  max_vel_y: 0.0 #Y轴线速度（全向移动机器人使用，差速轮设为0）
  min_vel_y: 0.0

  # The velocity when robot is moving in a straight line
  max_vel_trans: 1.5 #平移速度的最大/最小值
  min_vel_trans: 0

  max_vel_theta: 1.35 #角速度的最大/最小值
  min_vel_theta: 0.1

  acc_lim_x: 2.5 #各轴加速度限制
  acc_lim_y: 0.0
  acc_lim_theta: 3.2

  # Goal Tolerance Parameters 目标点误差容忍度 
  xy_goal_tolerance: 0.1
  yaw_goal_tolerance: 0.3
  latch_xy_goal_tolerance: false #是否锁定 XY 目标。如果为 true，一旦机器人到达 XY 容忍范围内，它将只旋转调整方向，即使旋转过程中稍微偏离 XY 范围也不会重新调整位置。


  # Forward Simulation Parameters
  sim_time: 2.0 # 增加预测时间，使机器人能更早规划转向
  vx_samples: 10  #速度采样数量
  vy_samples: 0
  vth_samples: 60 # 增加角速度采样数，提高转向搜索密度
  controller_frequency: 10.0

  # Trajectory Scoring Parameters
  path_distance_bias: 32.0
  goal_distance_bias: 24.0 # 稍微增加目标偏置，让机器人更积极地朝向目标
  occdist_scale: 0.02
  forward_point_distance: 0.05 # 减小前瞻距离，使评分更关注机器人中心，有助于原地转向
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  # Oscillation Prevention Parameters
  oscillation_reset_dist: 0.05

  # Debugging
  publish_traj_pc: true
  publish_cost_grid_pc: true
